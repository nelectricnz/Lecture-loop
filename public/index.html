<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Upload your lectures and study them as notes, explanations, narrated videos, flashcards, quizzes and tutoring.">
<title>Lecture Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: library rail on the left, lecture workspace on the right with study-mode tabs; stacks to one column on phones. */
:root {
  --paper: #F3F5F9;
  --surface: #FFFFFF;
  --ink: #141A29;
  --muted: #5A6278;
  --line: #DCE1EB;
  --soft: #E8ECF7;
  --accent: #2344CF;
  --accent-ink: #FFFFFF;
  --hl: #FFE14D;
  --hl-ink: #141A29;
  --good: #1D8549;
  --good-soft: #DDF3E5;
  --bad: #BF3428;
  --bad-soft: #FBE3E0;
  --shadow: 0 1px 2px rgba(20,26,41,.06), 0 6px 20px rgba(20,26,41,.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1119; --surface: #171B27; --ink: #E6E9F2; --muted: #9AA2B7; --line: #2A3044; --soft: #1F2536;
    --accent: #8299FF; --accent-ink: #0E1119; --hl: #E8C832; --hl-ink: #141A29;
    --good: #55C786; --good-soft: #17301F; --bad: #FF7B6C; --bad-soft: #3A1C19;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1119; --surface: #171B27; --ink: #E6E9F2; --muted: #9AA2B7; --line: #2A3044; --soft: #1F2536;
  --accent: #8299FF; --accent-ink: #0E1119; --hl: #E8C832; --hl-ink: #141A29;
  --good: #55C786; --good-soft: #17301F; --bad: #FF7B6C; --bad-soft: #3A1C19;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper); color: var(--ink);
  font: 16px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Top bar */
.top { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.brand h1 span { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding-inline: 2px; }
:root[data-theme="dark"] .brand h1 span, .brand h1 span { color: inherit; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); }
.dot.warn { background: var(--hl); }

/* Shell */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
.rail { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lib { display: flex; flex-direction: column; gap: 4px; }
.lib-item { text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lib-item:hover { background: var(--soft); }
.lib-item[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.lib-item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-item .m { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.tag { display: inline-block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--hl); color: var(--hl-ink); vertical-align: 2px; margin-left: 6px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; font-size: 15px; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn.block { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Workspace */
.work { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.head { padding: 24px 28px 0; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.head h2 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 800; letter-spacing: -.02em; min-width: 0; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 2px; padding: 18px 20px 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: transparent; padding: 10px 14px 12px; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 15px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding: 24px 28px 32px; min-width: 0; }

.empty { display: grid; gap: 12px; justify-items: start; max-width: 560px; padding-block: 12px; }
.empty h3 { font-size: 22px; }
.empty p { margin: 0; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
.banner { background: var(--soft); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; color: var(--ink); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--soft); border-radius: 10px; padding: 8px 8px 8px 14px; margin-bottom: 18px; font-size: 14px; }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }

/* Prose (notes, explanations) */
.prose { max-width: 70ch; overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; }
.prose h1, .prose h2 { font-size: 22px; margin: 1.6em 0 .5em; }
.prose h2 span.mk, .prose h2 { }
.prose h2 { display: inline-block; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--hl) 70%, transparent) 62%); padding-inline: 2px; }
.prose h3 { font-size: 18px; margin: 1.4em 0 .4em; }
.prose p, .prose li { line-height: 1.65; }
.prose strong { font-weight: 700; }
.prose code { font-family: var(--f-mono); font-size: .9em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.prose pre { background: var(--soft); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.prose pre code { background: none; padding: 0; }
.prose blockquote { margin: 1em 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
.prose table { border-collapse: collapse; width: 100%; font-size: 15px; }
.prose .tw { overflow-x: auto; margin: 1em 0; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.prose th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.thinking { color: var(--muted); font-style: italic; }

/* Explain */
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.style { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; }
.style b { font-family: var(--f-display); font-size: 16px; }
.style small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.style[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); box-shadow: inset 0 0 0 1px var(--accent); }
.field { display: grid; gap: 6px; }
.input, .textarea { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; }
.textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.input:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.divider { height: 1px; background: var(--line); margin: 22px 0; }

/* Flashcards */
.deck { display: grid; gap: 16px; max-width: 640px; }
.fc { perspective: 1400px; cursor: pointer; }
.fc-inner { position: relative; min-height: 260px; transition: transform .5s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.fc.flipped .fc-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; justify-content: center; gap: 12px; overflow: auto; }
.face .q { font-family: var(--f-display); font-size: clamp(20px, 2.6vw, 26px); font-weight: 700; line-height: 1.25; }
.face .a { font-size: 18px; line-height: 1.55; }
.face.back { transform: rotateY(180deg); background: var(--soft); }
.face .corner { position: absolute; top: 14px; left: 18px; }
.face .hint { position: absolute; bottom: 12px; right: 18px; font-size: 12px; color: var(--muted); }
.progress { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.btn.good { color: var(--good); }
.btn.again { color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 700; }

/* Quiz */
.quiz { max-width: 680px; display: grid; gap: 16px; }
.qtext { font-family: var(--f-display); font-size: clamp(20px, 2.4vw, 24px); font-weight: 700; line-height: 1.3; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font-family: var(--f-mono); font-size: 12px; font-weight: 600; border: 1px solid var(--line); border-radius: 6px; width: 24px; height: 24px; display: grid; place-items: center; flex: none; margin-top: 1px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.explain { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--ink); }
.score { display: flex; align-items: baseline; gap: 10px; }
.score b { font-family: var(--f-display); font-size: 64px; font-weight: 800; line-height: 1; }
.miss { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }

/* Tutor chat */
.chat { display: grid; gap: 14px; max-width: 760px; }
.msgs { display: grid; gap: 12px; }
.msg { max-width: 88%; padding: 12px 16px; border-radius: 16px; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.assistant { justify-self: start; background: var(--soft); border-bottom-left-radius: 4px; }
.msg.assistant.prose > :last-child { margin-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.compose { display: flex; gap: 8px; align-items: flex-end; }
.compose .textarea { min-height: 52px; }

/* Teach back */
.teach { display: grid; gap: 16px; max-width: 760px; }
.grade { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 20px; align-items: center; background: var(--soft); border-radius: 14px; padding: 18px 20px; }
.ring { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ring) calc(var(--v) * 1%), var(--line) 0); }
.ring > div { width: 74px; height: 74px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 26px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.cols h4 { margin: 0 0 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.cols ul { margin: 0; padding-left: 18px; }
.cols li { margin-bottom: 4px; }

/* Video */
.screen { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #10152A; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.screen canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.screen:fullscreen { max-width: none; border-radius: 0; background: #000; }
.screen:fullscreen canvas { object-fit: contain; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.dots button[aria-current="true"] { background: var(--hl); border-color: var(--hl); color: var(--hl-ink); font-weight: 600; }
.dots button:disabled { opacity: .5; cursor: default; }
.vsel { width: auto; max-width: 260px; padding: 6px 10px; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); font-weight: 700; }
.btn.ghost[aria-pressed="false"] { text-decoration: line-through; text-decoration-color: var(--muted); }
.script { max-width: 960px; font-size: 15px; }
.script summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.script ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 6px; }

/* Add lecture */
.add { padding: 28px; display: grid; gap: 20px; max-width: 760px; }
.drop { border: 2px dashed var(--line); border-radius: 16px; padding: 32px 20px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--paper); cursor: pointer; transition: border-color .15s, background .15s; }
.drop.over, .drop:hover { border-color: var(--accent); background: var(--soft); }
.drop b { font-family: var(--f-display); font-size: 20px; }
.types { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.types span { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.log { display: grid; gap: 4px; font-size: 14px; }
.log .ok { color: var(--good); }
.log .no { color: var(--bad); }
.source { white-space: pre-wrap; font-size: 15px; line-height: 1.6; max-width: 75ch; max-height: 70vh; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .lib { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .lib-item { min-width: 200px; max-width: 240px; flex: none; }
  .head { padding: 20px 18px 0; }
  .tabs { padding: 14px 10px 0; }
  .panel { padding: 20px 18px 28px; }
  .add { padding: 20px 18px; }
  .msg { max-width: 95%; }
  .face { padding: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<header class="top">
  <div class="brand"><h1><span>Lecture</span> Loop</h1></div>
  <div class="status" id="status"><i class="dot"></i><span>Connecting…</span></div>
</header>
<div class="shell">
  <aside class="rail">
    <button class="btn primary block" id="addBtn" type="button">+ Add a lecture</button>
    <div class="label" style="padding: 6px 4px 0">Your lectures</div>
    <nav class="lib" id="lib" aria-label="Lectures"></nav>
  </aside>
  <main class="work" id="main"></main>
</div>

<script>
(() => {
"use strict";

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
function md(text) {
  try {
    const html = window.DOMPurify.sanitize(window.marked.parse(String(text || "")));
    return html.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, "</table></div>");
  } catch {
    const d = document.createElement("div"); d.textContent = text; return "<p style='white-space:pre-wrap'>" + d.innerHTML + "</p>";
  }
}
const words = t => (String(t).trim().match(/\S+/g) || []).length;
const fmt = n => n.toLocaleString();
const newId = () => "L" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function pref(k, v) {
  try {
    if (v === undefined) return localStorage.getItem("ll." + k);
    localStorage.setItem("ll." + k, v);
  } catch { return null; }
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dateStr(t) { try { return new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } }

/* ---------- example lecture (shown so the app has something to teach on first open) ---------- */
const SAMPLE_ID = "example";
const SAMPLE = {
  id: SAMPLE_ID, example: true, type: "lecture", source: "Example", createdAt: 0,
  title: "Cellular Respiration",
  text: `BIOL 1010 – Lecture 9: Cellular Respiration

Today we follow a glucose molecule as the cell extracts usable energy from it. The overall equation is C6H12O6 + 6 O2 → 6 CO2 + 6 H2O + energy, roughly 30–32 ATP per glucose. The key idea: energy is released in small, controlled steps rather than all at once like burning, so the cell can capture it as ATP.

1. Glycolysis (cytoplasm). Glucose (6 carbons) is split into two pyruvate molecules (3 carbons each). It needs no oxygen. The cell invests 2 ATP and makes 4, for a net gain of 2 ATP, plus 2 NADH. NADH is an electron carrier: think of it as a charged battery that will be spent later.

2. Pyruvate oxidation (mitochondrial matrix). Each pyruvate enters the mitochondrion, loses one carbon as CO2, and becomes acetyl-CoA. This produces 1 NADH per pyruvate (2 per glucose).

3. The citric acid cycle, also called the Krebs cycle (mitochondrial matrix). Acetyl-CoA joins oxaloacetate to form citrate. Through eight steps the remaining carbons leave as CO2 and oxaloacetate is regenerated, which is why it is a cycle. Per glucose (two turns): 2 ATP, 6 NADH, 2 FADH2, 4 CO2. Notice that very little ATP is made directly; the real value is the loaded electron carriers.

4. Oxidative phosphorylation (inner mitochondrial membrane). This has two parts. First, the electron transport chain: NADH and FADH2 hand their electrons to a series of protein complexes. As electrons move down the chain, the complexes pump H+ ions from the matrix into the intermembrane space, building a concentration gradient. Oxygen is the final electron acceptor; it combines with electrons and H+ to form water. Without oxygen the chain backs up and stops. Second, chemiosmosis: H+ flows back into the matrix through ATP synthase, which works like a turbine and makes about 26–28 ATP. This stage produces about 90% of the cell's ATP.

Why the yield is "about" 30–32 ATP: the H+ gradient is also used for other transport work, and the exact count depends on how NADH from glycolysis is shuttled into the mitochondrion.

Fermentation. When oxygen is absent, cells still need to regenerate NAD+ so glycolysis can continue. In muscle cells, pyruvate becomes lactate (lactic acid fermentation). In yeast, pyruvate becomes ethanol and CO2 (alcoholic fermentation). Fermentation yields only the 2 ATP from glycolysis.

Exam tip: be able to say where each stage happens, what goes in, what comes out, and which stage needs oxygen directly (only the electron transport chain, though the citric acid cycle stops without it because NAD+ isn't recycled).`
};

/* ---------- storage: IndexedDB in this browser ---------- */
function idbStore() {
  const open = new Promise((res, rej) => {
    const r = indexedDB.open("lecture-loop", 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("audio"); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (store, mode, fn) => {
    const db = await open;
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  };
  return {
    kind: "local",
    async subscribe(cb) {
      const db = await open, t = db.transaction("docs"), s = t.objectStore("docs");
      const keys = s.getAllKeys(), vals = s.getAll();
      t.oncomplete = () => cb(keys.result.map((k, i) => [k, vals.result[i]]));
    },
    put: (id, data) => tx("docs", "readwrite", s => s.put(data, id)).catch(() => { throw { message: "This browser ran out of space. Delete an old lecture and try again." }; }),
    del: id => tx("docs", "readwrite", s => s.delete(id)),
    getAudio: key => tx("audio", "readonly", s => s.get(key)).catch(() => null),
    putAudio: (key, val) => tx("audio", "readwrite", s => s.put(val, key)).catch(() => {}),
    delAudio: prefix => tx("audio", "readwrite", s => s.delete(IDBKeyRange.bound(prefix, prefix + "￿"))).catch(() => {})
  };
}

  const m = {};

}

function applyDocs(docs, first) {

  lecs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    if (!res.ok) {

Reply with only JSON in this shape: {"title":"video title, max 8 words","scenes":[{"type":"title","heading":"...","sub":"...","narration":"..."}]}

${lectureBlock(lec)}`,

/* ---------- Flashcards ---------- */

    h("p", {}, "Ten multiple-choice questions from easy recall to harder application, each with an explanation of the right answer."),

      h("div", { class: "score" }, h("b", {}, `${right}/${qs.length}`), h("span", { class: "note" }, right === qs.length ? "Perfect score." : right >= qs.length * 0.7 ? "Solid. Review the ones you missed." : "Worth another pass. Try the flashcards on the topics below.")),
      m.quizLast && m.quizLast.prev != null ? h("div", { class: "note mono" }, `Previous attempt: ${m.quizLast.prev}/${qs.length}`) : null,

          h("span", { class: "note" }, q.explanation)))) : null,
      h("div", { class: "row" },
        h("button", { class: "btn primary", type: "button", onclick: restart }, "Retake"),

    }, h("span", { class: "k" }, "ABCD"[k]), h("span", {}, o)))),
    done ? h("div", { class: "explain" },
      h("b", { style: `color:var(${picked === q.answer ? "--good" : "--bad"})` }, picked === q.answer ? "Correct. " : "Not quite. "), q.explanation) : null,

function genQuiz(lec) {
  runJob("quiz", lec.id, async (signal, update) => {
    const data = await S.ai.json(P.quiz(lec), { signal, onText: ({ text }) => update(text), cache: false });
    const qs = (data && Array.isArray(data.questions) ? data.questions : [])
      .filter(q => q && q.q && Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length)

        const order = shuffle(q.options.map((_, i) => i));

/* ---------- Teach it back ---------- */
function vTeach(lec) {
  const st = S.teach.get(lec.id) || { concept: "", text: "", result: null };
  S.teach.set(lec.id, st);
  const running = isJob("teach", lec.id);
  const concept = h("input", { class: "input", id: "teachConcept", type: "text", value: st.concept, placeholder: "e.g. chemiosmosis", oninput: e => (st.concept = e.target.value) });
  const ta = h("textarea", { class: "textarea", id: "teachText", rows: "7", placeholder: "Explain it as if you were teaching a friend who missed the lecture. Use your own words.", oninput: e => (st.text = e.target.value) });
  ta.value = st.text;
  const r = st.result;
  let res = null;
  if (running) res = jobBar("Checking your explanation");
  else if (r) {
    const color = r.score >= 80 ? "var(--good)" : r.score >= 55 ? "var(--accent)" : "var(--bad)";
    const list = (title, items, col) => items && items.length ? h("div", {}, h("h4", { style: `color:${col}` }, title), h("ul", {}, items.map(i => h("li", {}, i)))) : null;
    res = h("div", { class: "teach" },
      h("div", { class: "grade" },
        h("div", { class: "ring", style: `--v:${r.score};--ring:${color}`, role: "img", "aria-label": `Score ${r.score} out of 100` }, h("div", {}, r.score)),
        h("div", {}, h("div", { class: "label" }, "Your explanation"), h("div", { style: "font-weight:700;font-size:18px" }, r.verdict))),
      h("div", { class: "cols" },
        list("What you got right", r.strengths, "var(--good)"),
        list("What's missing", r.gaps, "var(--accent)"),
        list("Not quite right", r.misconceptions, "var(--bad)")),
      r.better ? h("div", {}, h("div", { class: "label", style: "margin-bottom:6px" }, "A stronger version"), h("div", { class: "prose", html: md(r.better) })) : null);
  }
  return h("div", { class: "teach" },
    h("div", { class: "empty", style: "padding:0" },
      h("h3", {}, "Teach it back"),
      h("p", {}, "The fastest way to find gaps is to explain a topic yourself. Write your explanation and get a score with what you missed.")),
    h("div", { class: "field" }, h("label", { class: "label", for: "teachConcept" }, "Topic"), concept),
    h("div", { class: "field" }, h("label", { class: "label", for: "teachText" }, "Your explanation"), ta),
    h("div", {}, h("button", { class: "btn primary", type: "button", "data-ai": "", onclick: () => {
      if (words(st.text) < 8) { S.errors.set(lec.id + ":teach", "Write at least a couple of sentences first."); renderPanel(); return; }
      runJob("teach", lec.id, async signal => {
        const d = await S.ai.json(P.teach(lec, st.concept.trim(), st.text.trim()), { signal, cache: false });
        if (!d || typeof d.score !== "number") throw { code: "bad_shape" };
        const arr = v => Array.isArray(v) ? v.map(String).filter(Boolean) : [];
        st.result = { score: Math.max(0, Math.min(100, Math.round(d.score))), verdict: String(d.verdict || ""), strengths: arr(d.strengths), gaps: arr(d.gaps), misconceptions: arr(d.misconceptions), better: String(d.better || "") };
      });
    } }, "Check my explanation")),
    errorFor("teach", lec.id), res);
}

    if (useNatural() && !sceneBuf(PL.i) && !PL.rec) {
      // The next scene's narration is still being recorded: hold here until it is ready.
      PL.playing = false; stopSound(); drawAt(0); playVideo();
      return;
    }
    startScene(); PL.onState();
  }
  PL.raf = requestAnimationFrame(tick);
}
// Waits for the natural voice-over of the current scene (or all scenes); falls back to the browser voice if it can't load.
async function ensureAudio(all) {
  const pl = PL;
  if (!pl || !useNatural()) return true;
  if (!pl.aud || pl.aud.voice !== VOPT.narrator || pl.aud.failed) startAud(pl);
  const aud = pl.aud;
  if (all ? aud.done : aud.bufs[pl.i]) return true;
  pl.preparing = true; pl.onState();
  const ok = all ? (await aud.job, aud.done) : await sceneReady(aud, pl.i);
  if (PL !== pl) return false;
  pl.preparing = false;
  if (ok) pl.say("");
  else {
    pl.say("The natural voice couldn't load on this device, so this is using the browser voice.");
    VOPT.narrator = "browser";
    const sel = $("#vVoice"); if (sel) sel.value = "browser";
  }
  pl.onState();
  return true;
}
async function playVideo() {
  if (!PL || PL.preparing) return;
  const pl = PL;
  try { getCtx().resume(); } catch {}
  if (!(await ensureAudio(false)) || PL !== pl) return;
  if (PL.ended) { PL.i = 0; PL.ended = false; }
  PL.playing = true; startScene(); PL.onState(); tick();
}
function pauseVideo() {
  if (!PL) return;
  PL.playing = false; cancelAnimationFrame(PL.raf);
  stopSound();
  drawStill();
}
function finishPlay() {
  PL.playing = false; PL.ended = true;
  stopSound();
  drawAt(99);
  if (PL.rec && PL.rec.state === "recording") PL.rec.stop();
  PL.onState();
}
function goScene(k) {
  if (!PL || PL.rec || PL.preparing) return;
  PL.i = Math.max(0, Math.min(PL.video.scenes.length - 1, k)); PL.ended = false;
  if (PL.playing) { pauseVideo(); playVideo(); } else drawStill();
}
async function recordVideo(say) {
  if (!PL || PL.rec || PL.preparing) return;
  const pl = PL;
  pauseVideo();
  try { getCtx().resume(); } catch {}
  if (!(await ensureAudio(true)) || PL !== pl) return;
  const withAudio = useNatural() && !!sceneBuf(0);
  const types = withAudio
    ? ["video/mp4;codecs=avc1,mp4a.40.2", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
    : ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const mime = window.MediaRecorder && pl.canvas.captureStream ? types.find(t => MediaRecorder.isTypeSupported(t)) : null;
  if (!mime) { say("This browser can't record video. Try Chrome, Edge or Brave."); return; }
  const stream = pl.canvas.captureStream(30);
  if (withAudio) { pl.recDest = getCtx().createMediaStreamDestination(); pl.recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t)); }
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => (rec.onstop = r));
  pl.rec = rec; pl.abortRec = false; pl.i = 0; pl.ended = false;
  rec.start(1000);
  pl.playing = true; startScene(); pl.onState(); tick();
  say("Recording… keep this tab open. It takes as long as the video.");
  await stopped;
  stream.getTracks().forEach(tr => tr.stop());
  pl.rec = null; pl.recDest = null;
  if (pl.abortRec) return;
  if (PL === pl) pl.onState();
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
  const name = (pl.video.title || "explainer").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "explainer";
  const url = URL.createObjectURL(new Blob(chunks, { type: mime.split(";")[0] }));
  const a = h("a", { href: url, download: `${name}.${ext}` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  say(withAudio ? "Saved to your downloads, with the voice-over." : "Saved to your downloads (captions only: the browser voice can't be recorded).");
}

function vVideo(lec) {
  const m = mat(lec.id);
  const vids = Array.isArray(m.videos) ? m.videos : [];
  const st = S.videoUI.get(lec.id) || { sel: vids.length ? vids[0].id : null, focus: "", long: pref("vlong") === "1" };
  S.videoUI.set(lec.id, st);
  const make = () => runJob("video", lec.id, async (signal, update) => {
    const d = await S.ai.json(P.video(lec, st.focus.trim(), st.long), { signal, onText: ({ text }) => update(text), cache: false });
    const v = normVideo(d, st.focus.trim());
    st.sel = v.id;
    setMat(lec.id, { videos: [v, ...(mat(lec.id).videos || [])].slice(0, 8) });
  });
  const form = h("div", { style: "display:grid;gap:12px;max-width:760px" },
    h("div", { class: "label" }, vids.length ? "Make another video" : "Make a video"),
    h("div", { class: "row", style: "flex-wrap:nowrap" },
      h("div", { style: "flex:1;min-width:0" }, h("label", { class: "sr", for: "vFocus" }, "Topic"),
        h("input", { class: "input", id: "vFocus", type: "text", value: st.focus, placeholder: "Optional: one topic to explain, e.g. the Krebs cycle",
          oninput: e => (st.focus = e.target.value), onkeydown: e => { if (e.key === "Enter" && S.ai && !S.job) make(); } })),
      h("button", { class: "btn primary", type: "button", "data-ai": "", onclick: make }, "Make video")),
    h("div", { class: "row" },
      h("div", { class: "seg", role: "group", "aria-label": "Length" },
        h("button", { type: "button", "aria-pressed": st.long ? "false" : "true", onclick: () => { st.long = false; pref("vlong", "0"); renderPanel(); } }, "About 1 min"),
        h("button", { type: "button", "aria-pressed": st.long ? "true" : "false", onclick: () => { st.long = true; pref("vlong", "1"); renderPanel(); } }, "About 2 min")),
      h("span", { class: "note" }, "Animated scenes with a British voice-over and captions.")));

  let busy = null;
  if (isJob("video", lec.id)) {
    const c = h("p", { class: "note" }, "Thinking…");
    S.job.listeners.add(t => { const n = (t.match(/"narration"/g) || []).length; c.textContent = n ? `${n} scene${n > 1 ? "s" : ""} scripted so far` : "Thinking…"; });
    busy = h("div", {}, jobBar("Scripting your video"), c);
  }
  const err = errorFor("video", lec.id);
  if (!vids.length) return h("div", {}, err, busy || h("div", { class: "empty" },
    h("h3", {}, "Explainer videos"),
    h("p", {}, "Short animated videos that walk through the lecture scene by scene, read aloud, with captions. Watch here or save them as video files.")), busy ? null : form);

  const video = vids.find(v => v.id === st.sel) || vids[0];
  st.sel = video.id;
  const canvas = h("canvas", { width: VW, height: VH, "aria-label": `Video: ${video.title}` });
  const screen = h("div", { class: "screen" }, canvas);
  const playBtn = h("button", { class: "btn primary", type: "button" }, "Play");
  const msg = h("span", { class: "note", "aria-live": "polite" });
  const say = t => (msg.textContent = t);
  const dots = h("div", { class: "dots", role: "group", "aria-label": "Scenes" },
    video.scenes.map((s, k) => h("button", { type: "button", title: s.heading || s.term || s.value || `Scene ${k + 1}`, onclick: () => goScene(k) }, String(k + 1))));
  const saveBtn = h("button", { class: "btn small", type: "button", onclick: () => recordVideo(say) }, "Save as video");
  const fsBtn = h("button", { class: "btn small ghost", type: "button", onclick: () => { try { const p = screen.requestFullscreen && screen.requestFullscreen(); if (p && p.catch) p.catch(() => say("Full screen isn't available here.")); } catch { say("Full screen isn't available here."); } } }, "Full screen");
  const ccBtn = h("button", { class: "btn small ghost", type: "button", "aria-pressed": String(VOPT.captions), onclick: () => { VOPT.captions = !VOPT.captions; pref("cc", VOPT.captions ? "on" : "off"); ccBtn.setAttribute("aria-pressed", String(VOPT.captions)); ccBtn.textContent = VOPT.captions ? "Captions on" : "Captions off"; if (PL && !PL.playing) drawStill(); } }, VOPT.captions ? "Captions on" : "Captions off");
  const voiceBtn = h("button", { class: "btn small ghost", type: "button", "aria-pressed": String(VOPT.voice), onclick: () => { VOPT.voice = !VOPT.voice; pref("voice", VOPT.voice ? "on" : "off"); voiceBtn.textContent = VOPT.voice ? "Voice on" : "Voice off"; voiceBtn.setAttribute("aria-pressed", String(VOPT.voice)); if (PL && PL.playing) pauseVideo(); else if (PL) drawStill(); } }, VOPT.voice ? "Voice on" : "Voice off");
  const voiceSel = h("select", { class: "input vsel", id: "vVoice", "aria-label": "Narrator", onchange: e => {
    VOPT.narrator = e.target.value; pref("narrator", VOPT.narrator);
    if (PL && !PL.rec && !PL.preparing) { pauseVideo(); PL.aud = audioCache.get(video.id + ":" + VOPT.narrator) || null; drawStill(); }
  } }, NARRATORS.map(([id, label]) => h("option", { value: id, selected: id === VOPT.narrator }, label)));

  const onState = () => {
    if (!PL) return;
    const recording = !!PL.rec;
    playBtn.textContent = PL.preparing ? "Preparing…" : PL.playing ? "Pause" : PL.ended ? "Replay" : "Play";
    playBtn.disabled = recording || PL.preparing;
    saveBtn.disabled = recording || PL.preparing; voiceSel.disabled = recording || PL.preparing; saveBtn.textContent = recording ? "Recording…" : "Save as video";
    [...dots.children].forEach((b, k) => { b.setAttribute("aria-current", k === PL.i ? "true" : "false"); b.disabled = recording; });
  };
  playBtn.onclick = () => (PL && PL.playing ? pauseVideo() : playVideo());
  canvas.addEventListener("click", () => { if (PL && !PL.rec) PL.playing ? pauseVideo() : playVideo(); });
  requestAnimationFrame(() => { if (canvas.isConnected) mountPlayer(canvas, video, onState, say); });

  const del = h("button", { class: "btn small ghost danger", type: "button", onclick: () => {
    if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "Confirm delete"; return; }
    st.sel = null;
    for (const k of [...audioCache.keys()]) if (k.startsWith(video.id + ":")) audioCache.delete(k);
    if (S.store && S.store.delAudio) S.store.delAudio(video.id + ":");
    setMat(lec.id, { videos: (mat(lec.id).videos || []).filter(v => v.id !== video.id) });
    renderPanel();
  } }, "Delete video");

  return h("div", { style: "display:grid;gap:14px" }, err, busy,
    vids.length > 1 ? h("div", { class: "chips", role: "group", "aria-label": "Your videos" }, vids.map(v => h("button", {
      class: "chip", type: "button", "aria-pressed": v.id === video.id ? "true" : "false",
      onclick: () => { st.sel = v.id; renderPanel(); }
    }, v.title))) : null,
    screen,
    h("div", { class: "toolbar", style: "margin:0;max-width:960px" },
      h("div", { class: "row" }, playBtn, dots),
      h("div", { class: "row" }, voiceBtn, ccBtn, fsBtn, saveBtn)),
    h("div", { class: "row", style: "max-width:960px;justify-content:space-between" },
      h("div", { class: "row" }, voiceSel, msg),
      lec.example ? null : del),
    h("details", { class: "script" }, h("summary", {}, "Read the script"),
      h("ol", {}, video.scenes.map(s => h("li", {}, s.narration)))),
    h("p", { class: "note", style: "margin:0;max-width:960px" }, "The natural voices are made on your device: the first video downloads the voice (about 90 MB, once), then each new video takes a little while to record. Saved videos include the voice-over."),
    h("div", { class: "divider", style: "margin:4px 0" }),
    busy ? null : form);
}

function vSource(lec) {
  return h("div", { style: "display:grid;gap:12px" },
    h("div", { class: "label" }, "Lecture text the study tools work from"),

/* ---------- Add lecture ---------- */
const LIBS = {
  pdf: ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"],
  docx: ["https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"],
  zip: ["https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"]
};
const loaded = {};
function loadLib(name) {
  return loaded[name] || (loaded[name] = LIBS[name].reduce((p, src) => p.then(() => new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res;
    s.onerror = () => { loaded[name] = null; rej(new Error("A file reader couldn't load. Check your connection.")); };
    document.head.appendChild(s);
  })), Promise.resolve()));
}
async function readPdf(file) {
  await loadLib("pdf");
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = LIBS.pdf[1];
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    let s = "";
    for (const it of tc.items) s += (it.str || "") + (it.hasEOL ? "\n" : " ");
    pages.push(s.replace(/[ \t]+\n/g, "\n").trim());
  }
  return pages.map((t, i) => t ? `[Page ${i + 1}]\n${t}` : "").filter(Boolean).join("\n\n");
}
async function readDocx(file) {
  await loadLib("docx");
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return r.value;
}
async function readPptx(file) {
  await loadLib("zip");
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const num = n => +(n.match(/(\d+)\.xml$/) || [0, 0])[1];
  const grab = async path => {
    const xml = new DOMParser().parseFromString(await zip.file(path).async("string"), "application/xml");
    return [...xml.getElementsByTagName("a:p")].map(p => [...p.getElementsByTagName("a:t")].map(t => t.textContent).join("")).filter(Boolean).join("\n");
  };
  const slides = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
  const out = [];
  for (const s of slides) {
    const n = num(s);
    let text = await grab(s);
    const notesPath = `ppt/notesSlides/notesSlide${n}.xml`;
    if (zip.file(notesPath)) { const nt = (await grab(notesPath)).replace(/^\d+$/m, "").trim(); if (nt) text += `\nSpeaker notes: ${nt}`; }
    if (text.trim()) out.push(`[Slide ${n}]\n${text}`);
  }
  return out.join("\n\n");
}
const ext = f => (f.name.split(".").pop() || "").toLowerCase();
const nice = name => name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").replace(/\s+/g, " ").trim() || "Untitled lecture";
const MAX_TEXT = 120000;

async function createLecture(title, text, source) {
  text = text.replace(/\u0000/g, "").replace(/\n{3,}/g, "\n\n").trim();
  let note = "";
  if (text.length > MAX_TEXT) { text = text.slice(0, MAX_TEXT); note = " (trimmed to fit)"; }
  const id = newId();
  const lec = { id, type: "lecture", title: title.slice(0, 140), text, source, words: words(text), createdAt: Date.now() };
  S.lectures = new Map([[id, { ...lec, _pending: true }], ...S.lectures]);
  const { id: _omit, ...data } = lec;
  await S.store.put(id, data);
  return { lec, note };
}

function renderAdd() {
  const log = h("div", { class: "log", "aria-live": "polite" });
  const say = (cls, text) => log.append(h("div", { class: cls }, text));
  const titleIn = h("input", { class: "input", id: "newTitle", type: "text", placeholder: "Defaults to the file name" });
  const fileIn = h("input", { type: "file", id: "fileIn", multiple: true, accept: ".pdf,.docx,.pptx,.txt,.md,.markdown,.csv,.vtt,.srt,image/*", class: "sr" });
  const canImg = !!(S.aiLimits && S.aiLimits.images);
  let made = null;

  async function handle(files) {
    files = [...files];
    if (!files.length) return;
    if (!S.store) { say("no", "Still connecting to storage. Try again in a moment."); return; }
    const imgs = files.filter(f => f.type.startsWith("image/"));
    const docs = files.filter(f => !f.type.startsWith("image/"));
    const customTitle = titleIn.value.trim();
    for (const f of docs) {
      say("", `Reading ${f.name}…`);
      try {
        const e = ext(f);
        let text, source;
        if (e === "pdf") { text = await readPdf(f); source = "PDF"; }
        else if (e === "docx") { text = await readDocx(f); source = "Word"; }
        else if (e === "pptx") { text = await readPptx(f); source = "Slides"; }
        else if (["txt", "md", "markdown", "csv", "vtt", "srt"].includes(e) || f.type.startsWith("text/")) { text = await f.text(); source = e === "vtt" || e === "srt" ? "Transcript" : "Text"; }
        else if (/^(audio|video)\//.test(f.type)) { say("no", `${f.name}: audio and video can't be read directly. Paste the transcript below instead.`); continue; }
        else { say("no", `${f.name}: this file type isn't supported. Use PDF, Word, PowerPoint, text or images.`); continue; }
        if (words(text) < 15) {
          say("no", e === "pdf" ? `${f.name}: no selectable text found. It may be scanned. Upload screenshots of the pages as images instead.` : `${f.name}: no readable text found.`);
          continue;
        }
        const { lec, note } = await createLecture(customTitle && files.length === 1 ? customTitle : nice(f.name), text, source);
        made = lec; say("ok", `Added "${lec.title}" · ${fmt(lec.words)} words${note}`);
      } catch (err) { say("no", `${f.name}: ${err && err.message ? err.message : "couldn't be read."}`); }
    }
    if (imgs.length) {
      if (!S.ai || !canImg) say("no", "Reading slide photos needs the site passcode. Unlock it on any lecture's page first, or paste the text instead.");
      else {
        const max = S.aiLimits.images.maxCount || 5;
        const parts = [];
        for (let i = 0; i < imgs.length; i += max) {
          const batch = imgs.slice(i, i + max);
          say("", `Transcribing ${batch.length} image${batch.length > 1 ? "s" : ""} with Claude…`);
          try { const r = await S.ai(P.images(), { images: batch, cache: false }); parts.push(r.text); }
          catch (e) { if (HIDE.has(e.code)) S.ai = null; say("no", errText(e)); }
        }
        const text = parts.join("\n\n");
        if (words(text) >= 15) {
          try {
            const { lec, note } = await createLecture(customTitle || (imgs.length === 1 ? nice(imgs[0].name) : `Slide photos (${imgs.length})`), text, "Images");
            made = lec; say("ok", `Added "${lec.title}" · ${fmt(lec.words)} words${note}`);
          } catch (e) { say("no", e.message || "Couldn't save."); }
        } else if (parts.length) say("no", "Couldn't find readable text in those images.");
      }
    }
    renderLibrary();
    if (made) openDone.hidden = false;
  }

  const drop = h("label", { class: "drop", for: "fileIn",
    ondragover: e => { e.preventDefault(); drop.classList.add("over"); },
    ondragleave: () => drop.classList.remove("over"),
    ondrop: e => { e.preventDefault(); drop.classList.remove("over"); handle(e.dataTransfer.files); }
  },
    h("b", {}, "Drop lecture files here"),
    h("span", { class: "note" }, "or click to choose. Several files at once is fine; each becomes its own lecture."),
    h("div", { class: "types" }, ["PDF", "DOCX", "PPTX", "TXT / MD", "VTT / SRT transcripts", canImg ? "Slide photos" : null].filter(Boolean).map(t => h("span", {}, t))));
  fileIn.addEventListener("change", () => { handle(fileIn.files); fileIn.value = ""; });

  const paste = h("textarea", { class: "textarea", id: "pasteText", rows: "8", placeholder: "Paste lecture notes, a transcript from Zoom, Panopto or YouTube, or textbook pages" });
  const openDone = h("button", { class: "btn primary", type: "button", hidden: true, onclick: () => {
    if (!made) return;
    S.currentId = made.id; S.view = "lecture"; S.mode = "notes"; S.userPicked = true;
    renderLibrary(); renderMain();
    if (S.ai && !mat(made.id).notes) genNotes(S.lectures.get(made.id) || made);
  } }, "Start studying");

  return h("div", { class: "add" },
    h("div", {}, h("h2", { style: "font-size:30px;font-weight:800" }, "Add a lecture"),
      h("p", { class: "note", style: "margin:6px 0 0" }, "Lectures are kept " + (S.store && S.store.kind === "cloud" ? "privately in your Claude account. Only you can see them." : "in this browser."))),
    h("div", { class: "field" }, h("label", { class: "label", for: "newTitle" }, "Title (optional)"), titleIn),
    drop, fileIn,
    h("div", { class: "field" }, h("label", { class: "label", for: "pasteText" }, "Or paste text"), paste,
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: async () => {
        const t = paste.value;
        if (words(t) < 15) { say("no", "Paste at least a paragraph of lecture text."); return; }
        try {
          const { lec, note } = await createLecture(titleIn.value.trim() || (t.trim().split("\n")[0].slice(0, 60) || "Pasted lecture"), t, "Pasted");
          made = lec; paste.value = ""; say("ok", `Added "${lec.title}" · ${fmt(lec.words)} words${note}`);
          renderLibrary(); openDone.hidden = false;
        } catch (e) { say("no", e.message || "Couldn't save."); }
      } }, "Add pasted text"),
      h("span", { class: "note" }, "Recorded lecture? Most video platforms let you download the transcript."))),
    log,
    h("div", { class: "row" }, openDone, h("button", { class: "btn ghost", type: "button", onclick: () => { S.view = "lecture"; renderLibrary(); renderMain(); } }, "Back")));
}

/* ---------- boot ---------- */
$("#addBtn").addEventListener("click", () => { S.view = "add"; renderLibrary(); renderMain(); });
if (!MODES.some(([id]) => id === S.mode)) S.mode = "notes";
renderLibrary();
renderMain();
initAI();
initStore();
})();
</script>
